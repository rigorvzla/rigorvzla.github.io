<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02010F" />
    <title>RigorVzla</title>
    <base href="/" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/motocontrol.css?v=2" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="RigorVzla_App_Web.styles.css" rel="stylesheet" />
</head>

<body>
    <!-- Fondo de partículas tecnológicas (detrás del contenido Blazor) -->
    <canvas id="airh-particles" aria-hidden="true"></canvas>

    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Ocurrio un problema.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        // Función para descargar archivos
        window.triggerFileDownload = (fileName, url) => {
            const anchorElement = document.createElement('a');
            anchorElement.href = url;
            anchorElement.download = fileName ?? '';
            anchorElement.click();
            anchorElement.remove();
        }
    </script>

    <script src="js/airh-particles.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/mc.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
